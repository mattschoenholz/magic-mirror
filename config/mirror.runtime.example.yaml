# Example mirror runtime config — SAFE TO COMMIT (no secrets).
# Copy to mirror.runtime.local.yaml for overrides (gitignored), or merge paths
# on the Pi under /etc/mirror/ as your backend prefers.
#
# See docs/MIRROR_RUNTIME.md for full semantics.

timezone: America/Los_Angeles

home_assistant:
  base_url: http://homeassistant.local:8123
  # Token: file on Pi only, e.g. /etc/mirror/ha_token (chmod 600).
  # token_file: /etc/mirror/ha_token

entities:
  # Large “now” tile: first usable state wins (default tries Pirate Weather first — better day/night vs some Open-Meteo states).
  # Falls back to `weather_entities` if none of these exist or are usable.
  weather_now_entities:
    - weather.pirateweather
    - weather.home
    - weather.forecast_home
  # Legacy chain for fallback “now” and default hourly source when forecast list omitted.
  weather: weather.home
  weather_entities:
    - weather.home
    - weather.pirateweather
    - weather.forecast_home
  # Hourly strip (6 slots, next full periods after *now*): try in order; default = same as weather_entities.
  forecast_weather_entities:
    - weather.pirateweather
    - weather.home
    - weather.forecast_home
  # HA UI friendly name (e.g. "Local To-do") is not the entity_id — use Settings → Entities or dev tools.
  todo_list: todo.elliot
  # Optional: multiple lists in order (merged, deduped by uid or title); omit to use todo_list only.
  # todo_entities:
  #   - todo.elliot

school_calendar:
  max_events_per_day: 4
  refresh_seconds: 900 # 15 minutes
  user_agent: MagicMirrorFamily/1.0
  # Some hosts return 403 without a site Referer; safe for public calendar pages.
  http_referer: https://www.bishopblanchet.org/
  feeds:
    - name: "CP - Community Period"
      url: https://www.bishopblanchet.org/calendar/calendar_356.ics
    - name: "Gold Day"
      url: https://www.bishopblanchet.org/calendar/calendar_358.ics
    - name: "Green Day"
      url: https://www.bishopblanchet.org/calendar/calendar_352.ics
    - name: "Special Schedule"
      url: https://www.bishopblanchet.org/calendar/calendar_377.ics
    - name: "Unified Day"
      url: https://www.bishopblanchet.org/calendar/calendar_360.ics

# spotify: deferred — client_id, client_secret, refresh_token on Pi only (see MIRROR_RUNTIME.md)
# youtube: deferred — OAuth on Pi only; hide Video Radar if missing or error

# --- Pi-only (not read by backend today): nightly display blanking ---
# Match Pi system timezone: sudo timedatectl set-timezone America/Los_Angeles
# Install timers: ./scripts/deploy-mirror-to-pi.sh --install-display-sleep
# Or on Pi: MIRROR_APP_DIR=~/mirror-app bash ~/mirror-app/scripts/install-pi-display-sleep-schedule.sh
# display_sleep:
#   off_time: "23:00" # local wall clock
#   on_time: "06:00"
#   method: "both" # hdmi | cec | both — default deploy uses both (cec-utils on Pi)
