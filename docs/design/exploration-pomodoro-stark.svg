<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
  <title id="title">Exploration: pomodoro stark monochrome</title>
  <desc id="desc">Large countdown; neutral uppercase phase; no blue accent.</desc>
  <rect width="1080" height="1920" fill="#0c0c0d"/>
  <text x="540" y="628" text-anchor="middle" fill="#8f8f98" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="500" letter-spacing="0.35em">FOCUS</text>
  <text x="540" y="820" text-anchor="middle" fill="#ececee" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="128" font-weight="700" font-variant-numeric="tabular-nums">24<tspan fill="#5c5c64" font-weight="600">:</tspan>37</text>
  <text x="540" y="904" text-anchor="middle" fill="#7a7a85" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="400">25 minutes remaining</text>
  <text x="540" y="1180" text-anchor="middle" fill="#5c5c64" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="400" letter-spacing="0.06em">pause  &#183;  resume  &#183;  new timer</text>
  <text x="540" y="1230" text-anchor="middle" fill="#45454e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">Echo to Home Assistant</text>
  <text x="540" y="220" text-anchor="middle" fill="#35353c" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="500" font-variant-numeric="tabular-nums">10:42</text>
  <text x="540" y="1840" text-anchor="middle" fill="#2a2a30" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="400">exploration / pomodoro / stark</text>
</svg>
