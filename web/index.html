<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Mirror — passive UI (demo)</title>
  <link rel="stylesheet" href="css/tokens.css?v=20260323" />
  <link rel="stylesheet" href="css/mirror.css?v=20260323" />
</head>
<body class="mirror mirror--passive has-dev-banner">
  <div class="dev-banner" role="status">Demo data · wire to Home Assistant via local backend (FR-006)</div>

  <!-- Weather symbols: colors via CSS variables (--wx-*) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <symbol id="wx-clear" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="12" fill="none" stroke="var(--wx-sun)" stroke-width="2.5" />
        <g stroke="var(--wx-sun-ray)" stroke-width="2.2" stroke-linecap="round">
          <line x1="32" y1="6" x2="32" y2="12" /><line x1="32" y1="52" x2="32" y2="58" />
          <line x1="6" y1="32" x2="12" y2="32" /><line x1="52" y1="32" x2="58" y2="32" />
          <line x1="14" y1="14" x2="18" y2="18" /><line x1="46" y1="46" x2="50" y2="50" />
          <line x1="50" y1="14" x2="46" y2="18" /><line x1="18" y1="46" x2="14" y2="50" />
        </g>
      </symbol>
      <symbol id="wx-partly-cloudy" viewBox="0 0 64 64">
        <circle cx="46" cy="22" r="9" fill="none" stroke="var(--wx-sun)" stroke-width="2.2" />
        <path fill="var(--wx-cloud)" opacity="0.95" d="M18 44c-5 0-9-4-9-9 0-4 3-8 7-9 1-6 7-11 14-11 6 0 11 3 13 8h2c5 0 9 4 9 9s-4 9-9 9H18z" />
      </symbol>
      <symbol id="wx-cloudy" viewBox="0 0 64 64">
        <path fill="var(--wx-cloud-dark)" opacity="0.92" d="M46 24c0-8-7-14-15-14-6 0-11 3-14 8-6 1-10 6-10 12 0 7 6 12 13 12h32c6 0 11-5 11-11 0-5-4-10-9-11-1-4-5-6-8-6z" />
      </symbol>
      <symbol id="wx-rain" viewBox="0 0 64 64">
        <path fill="var(--wx-cloud-dark)" opacity="0.9" d="M44 20c0-7-6-12-13-12-5 0-10 3-12 7-5 1-8 5-8 10 0 6 5 10 11 10h28c5 0 9-4 9-9 0-4-3-8-7-9-1-3-4-5-8-5z" transform="translate(-4 2)" />
        <g stroke="var(--wx-rain)" stroke-width="2.4" stroke-linecap="round">
          <line x1="22" y1="44" x2="18" y2="54" /><line x1="32" y1="44" x2="28" y2="56" /><line x1="42" y1="44" x2="38" y2="54" />
        </g>
      </symbol>
      <symbol id="wx-snow" viewBox="0 0 64 64">
        <path fill="var(--wx-cloud)" opacity="0.9" d="M44 20c0-7-6-12-13-12-5 0-10 3-12 7-5 1-8 5-8 10 0 6 5 10 11 10h28c5 0 9-4 9-9 0-4-3-8-7-9-1-3-4-5-8-5z" transform="translate(-4 2)" />
        <g fill="var(--wx-snow)" stroke="var(--wx-rain)" stroke-width="0.8">
          <circle cx="22" cy="48" r="2.5" /><circle cx="32" cy="52" r="2.5" /><circle cx="42" cy="48" r="2.5" />
        </g>
      </symbol>
      <symbol id="wx-thunderstorm" viewBox="0 0 64 64">
        <path fill="var(--wx-cloud-dark)" opacity="0.9" d="M44 18c0-7-6-12-13-12-5 0-10 3-12 7-5 1-8 5-8 10 0 6 5 10 11 10h28c5 0 9-4 9-9 0-4-3-8-7-9-1-3-4-5-8-5z" transform="translate(-4 0)" />
        <path fill="var(--wx-bolt)" d="M34 36l-8 12h6l-4 10 14-14h-7l5-8z" />
      </symbol>
      <symbol id="wx-fog" viewBox="0 0 64 64">
        <g stroke="var(--wx-fog)" stroke-width="3" stroke-linecap="round" opacity="0.95">
          <line x1="12" y1="26" x2="52" y2="26" /><line x1="8" y1="34" x2="56" y2="34" /><line x1="14" y1="42" x2="50" y2="42" />
        </g>
      </symbol>
      <symbol id="wx-wind" viewBox="0 0 64 64">
        <g fill="none" stroke="var(--wx-wind)" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
          <path d="M10 22h36c4 0 7-3 7-7s-3-7-7-7" />
          <path d="M14 34h40c5 0 9 4 9 9s-4 9-9 9H24" />
          <path d="M10 46h28" />
        </g>
      </symbol>
      <symbol id="wx-default" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="18" fill="none" stroke="var(--wx-muted)" stroke-width="2.5" opacity="0.75" />
        <path d="M26 26l12 12M38 26L26 38" stroke="var(--wx-muted)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
      </symbol>
    </defs>
  </svg>

  <main class="safe-chrome">
    <header class="clock-zone" aria-label="Time">
      <p class="clock-zone__time" id="clock-time">--:--</p>
      <p class="clock-zone__date" id="clock-date">—</p>
    </header>

    <section class="module module-now-playing" aria-labelledby="np-heading">
      <h2 class="module__label" id="np-heading">Now playing</h2>
      <div class="now-playing__layout">
        <div class="now-playing__current">
          <div class="now-playing__art-wrap">
            <img class="now-playing__art" id="now-playing-art" alt="" width="140" height="140" hidden />
            <div class="now-playing__art-placeholder" id="now-playing-art-placeholder" aria-hidden="true"></div>
          </div>
          <div class="now-playing__meta">
            <p class="now-playing__title" id="now-playing-title">Nothing playing</p>
            <p class="now-playing__artist" id="now-playing-artist"></p>
          </div>
        </div>
        <aside class="now-playing__next" aria-labelledby="np-next-heading">
          <h3 class="now-playing__next-heading" id="np-next-heading">Next up</h3>
          <p class="now-playing__next-artist" id="now-playing-next-artist">—</p>
          <p class="now-playing__next-title" id="now-playing-next-title"></p>
        </aside>
      </div>
    </section>

    <div class="content-below-now-playing">
      <section class="module module-weather" aria-labelledby="weather-heading">
        <h2 class="module__label" id="weather-heading">Weather</h2>
        <div class="weather-today">
          <div class="weather-today__icon" id="weather-today-icon" aria-hidden="true"></div>
          <div class="weather-today__text">
            <p class="weather-today__condition" id="weather-condition">—</p>
            <p class="weather-today__metrics" id="weather-metrics"></p>
          </div>
        </div>
        <div class="weather-hourly" id="weather-hourly" role="list" aria-label="Rest of today, six-hour outlook"></div>
      </section>

      <section class="module module-calendar module-calendar--five" aria-labelledby="cal-heading">
        <h2 class="module__label" id="cal-heading">Calendar</h2>
        <div class="calendar-week" id="calendar-week" role="list" aria-label="Today and next four days"></div>
      </section>

      <section class="module module-todo" aria-labelledby="todo-heading">
        <h2 class="module__label" id="todo-heading">To-Do</h2>
        <ul class="todo-list todo-list--grid" id="todo-list"></ul>
      </section>

      <section class="module module-video-radar" id="module-video-radar" aria-labelledby="vr-heading">
        <h2 class="module__label" id="vr-heading">Video radar</h2>
        <div class="video-radar" id="video-radar" role="list" aria-label="Recent videos from subscriptions"></div>
      </section>
    </div>
  </main>

  <script src="js/demo-data.js?v=20260323"></script>
  <script src="js/weather-icons.js?v=20260323"></script>
  <script src="js/app.js?v=20260323"></script>
</body>
</html>
